# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - api-fractales-academy

on:
  workflow_dispatch:
    inputs:
      schema_confirmation:
        description: 'Tras validar SQL 09 y pruebas en Azure, escribir V45_VERIFICADA'
        required: true
        type: string

jobs:
  build:
    if: ${{ inputs.schema_confirmation == 'V45_VERIFICADA' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install and validate application
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          npm prune --omit=dev --ignore-scripts

      - name: Prepare application artifact without local data
        run: zip -qr app-v45.zip server public package.json package-lock.json node_modules

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: app-v45.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_93EF3D0ED0674276B297BCEDF669077D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C8BFE19576EF432F809CE9E352BF06FD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_773BE96E252B4C90ADE61C00508367FA }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'api-fractales-academy'
          slot-name: 'Production'
          package: app-v45.zip

